services:
  web:
    build: .
    container_name: nimbusdocs
    ports:
      - "8067:67"
    volumes:
      # Las webs van a la ruta oficial
      - ./www:/var/www/html
      # Pasamos LA CARPETA ENTERA a sites-available
      - ./apache/conf:/etc/apache2/sites-available
  proxy:
    image: nginx:latest
    container_name: nimbusdocs-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certificados:/etc/nginx/certificados:ro
    depends_on:
      - web