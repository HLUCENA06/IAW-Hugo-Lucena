#BLOQUE FANTASMA
<VirtualHost *:67> 
        ServerName default
        DocumentRoot /usr/apache2/htdocs/bloqueo

        <Directory /usr/local/apache2/htdocs/bloqueo>
		Require all denied
	</Directory>
</VirtualHost>

#MARCA PUBLICA
#Virtual host de hugo.iaw.net. Primero pongo el puerto al que escucha
<VirtualHost *:67> 
#Domino principal al que corresponde este bloque:
	ServerName hugo.iaw.net
	
	#Alias por si entran con las www
	ServerAlias www.hugo.iaw.net

	#Ruta exacta del contenedor donde esta el index.html
	DocumentRoot /usr/local/apache2/htdocs/hugo.iaw.net

	#Guarda los errores separados de los demas
	ErrorLog logs/hugo_error.log
        CustomLog logs/hugo_access.log common

	#Le doy permisos a todos para leer los archivos de la carpeta
	<Directory /usr/local/apache2/htdocs/hugo.iaw.net>
		Require all granted
	</Directory>
</VirtualHost>

#MARCA INTERNA
#Virtual host de lucena.iaw.local
<VirtualHost *:67>     
#Domino principal al que corresponde este bloque:
        ServerName lucena.iaw.local 
        
        #Alias por si entran con las www
        ServerAlias www.lucena.iaw.local

        #Ruta exacta del contenedor donde esta el index.html
        DocumentRoot /usr/local/apache2/htdocs/lucena.iaw.local

        #Guarda los errores separados de los demas
        ErrorLog logs/lucena_error.log
        CustomLog logs/lucena_access.log common

        #Bloquear un archivo
        <Files "configurar.php">
                Require all denied
        </Files>

        #Le doy permisos a todos para leer los archivos de la carpeta
        <Directory /usr/local/apache2/htdocs/lucena.iaw.local>
                Require all granted
                 #Ocultar carpetas
                Options -Indexes
        </Directory>
</VirtualHost>