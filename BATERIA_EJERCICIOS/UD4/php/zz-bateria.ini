; Batería UD4 · bloque 4 · Tu php.ini para producción.
; PHP lo lee AL ARRANCAR: después de cada cambio, ./bateria.sh recargar (reinicia PHP).
; Apartados 6 y 7 de la UD4.

; 👀 4.1 · Ya resuelto: un script no puede comerse más de 128 MB.
memory_limit = 128M

; ✍️ 4.2 · Que PHP no diga su versión en las cabeceras.

; ✍️ 4.3 · Que el usuario NO vea los errores (tampoco los del arranque).

; ✍️ 4.4 · Que los errores SÍ se guarden, en /var/log/lab/php-errores.log.

; ✍️ 4.5 · Funciones que ejecutan órdenes del sistema, desactivadas: exec, shell_exec, system, passthru, proc_open y popen.

; ✍️ 4.6 · Subidas de 2 MB como mucho, y formularios de 4 MB como mucho.

; ✍️ 4.7 · Que la cookie de sesión no se pueda leer desde JavaScript.
