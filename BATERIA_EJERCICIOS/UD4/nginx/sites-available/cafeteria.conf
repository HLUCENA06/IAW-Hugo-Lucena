# Batería UD4 · La cafetería del instituto
# Después de cada cambio: ./bateria.sh recargar  (hace nginx -t y, si está bien, recarga Nginx).

# 👀 1.1 · Ya resuelto: lo que llegue por HTTP se redirige a HTTPS (lo hiciste en la UD3).
server {
    listen 80 default_server;
    server_name cafeteria.iaw.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name cafeteria.iaw.local;

    ssl_certificate     /etc/ssl/lab/lab.crt;
    ssl_certificate_key /etc/ssl/lab/lab.key;

    root  /var/www/cafeteria;
    index index.php index.html;

    access_log /var/log/nginx/cafeteria_access.log;
    error_log  /var/log/nginx/cafeteria_error.log;

    # 👀 1.2 · Ya resuelto: los estáticos (hola.txt) los sirve Nginx, sin pasar por PHP.
    location / {
        try_files $uri $uri/ =404;
    }

    # ✍️ 1.3 · Los .php, a la cocina (PHP-FPM, en el contenedor «php», puerto 9000).
    #    Un bloque location que:
    #      - solo coja lo que acaba en .php;
    #      - devuelva 404 si el fichero no existe (sin molestar a PHP);
    #      - lo pase por FastCGI a php:9000, con los parámetros estándar;
    #      - y le diga a PHP qué fichero tiene que ejecutar (SCRIPT_FILENAME).
    #    Apartado 2.1 de la UD4.
    location ~ \.php$ {                     # si lo que piden acaba en .php…
    try_files $uri =404;                # …y el fichero existe (si no, 404 sin molestar a PHP)…
    fastcgi_pass  php:9000;             # …llévalo a la cocina: el contenedor «php», puerto 9000…
    include       fastcgi_params;       # …con los datos estándar de la petición…
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;   # …y dile QUÉ fichero ejecutar
    }    
    # ✍️ 5.3 · La página de estado del pool (/estado-fpm): a PHP-FPM, pero solo desde redes privadas.

    # ✍️ 5.5 y 5.6 · Que no se vean info.php ni nada de la carpeta inc/.
}
