# BLOQUE FANTASMA
<VirtualHost *:67>
    ServerName default
    DocumentRoot /var/www/html/bloqueo
    <Directory /var/www/html/bloqueo>
        Require all denied
    </Directory>
</VirtualHost>

# MARCA PUBLICA
<VirtualHost *:67>
    ServerName hugo.iaw.net
    ServerAlias www.hugo.iaw.net
    DocumentRoot /var/www/html/hugo.iaw.net
    ErrorLog /var/log/apache2/hugo_error.log
    CustomLog /var/log/apache2/hugo_access.log common
    <Directory /var/www/html/hugo.iaw.net>
        Require all granted
    </Directory>
</VirtualHost>

# MARCA INTERNA (Asegúrate de cambiar también aquí las rutas)
<VirtualHost *:67>
    ServerName lucena.iaw.local
    DocumentRoot /var/www/html/lucena.iaw.local
    ErrorLog /var/log/apache2/lucena_error.log
    CustomLog /var/log/apache2/lucena_access.log common
    
    <Directory /var/www/html/lucena.iaw.local>
        Require all granted
    </Directory>

    <Files "configurar.php">
        Require all denied
    </Files>
</VirtualHost>