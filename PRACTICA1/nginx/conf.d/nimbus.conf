#Definir zona limite de peticiones
limit_req_zone $binary_remote_addr zone=limite_nimbus:10m rate=3r/s;

server {
    listen 80;
    server_name hugo.iaw.net www.hugo.iaw.net lucena.iaw.local www.lucena.iaw.local;

    # Redirección permanente con código 301
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name hugo.iaw.net www.hugo.iaw.net lucena.iaw.local www.lucena.iaw.local;

    # Rutas a tus certificados ECDSA 
    ssl_certificate     /etc/nginx/certificados/hugo.crt;
    ssl_certificate_key /etc/nginx/certificados/hugo.key;

    #Restringir estrictamente a TLS 1.2 y TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    #Cipher suite seguro y razonado
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    #Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Bloque de Proxy Inverso hacia tu Apache interno
    location / {
        #Aplicar limite de peticiones
        limit_req zone=limite_nimbus burst=5 nodelay;

        proxy_pass http://web:67;
        
        # Cabeceras obligatorias para que Apache sepa qué dominio se pidió originalmente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
