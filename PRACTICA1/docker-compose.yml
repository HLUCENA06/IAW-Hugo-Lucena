services:
  web:
    build: .
    container_name: nimbusdocs
    ports:
      - "8067:67"
    volumes:
      # Vincula la carpeta local con los index a la ruta oficial de Ubuntu
      - ./www:/var/www/html
      # Vincula el vhosts directamente a la carpeta de sitios activados de Ubuntu
      - ./apache/conf/vhosts.conf:/etc/apache2/sites-enabled/vhosts.conf