# 👀 Sitio del inventario (UD6). Ya está hecho: es lo de la UD4 (PHP) y la UD5 (Python) juntos.
# Vive en servidor/nginx: esta carpeta va a Git (bloque 5).

server {
    listen 80 default_server;
    server_name inventario.iaw.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name inventario.iaw.local;

    ssl_certificate     /etc/ssl/lab/lab.crt;
    ssl_certificate_key /etc/ssl/lab/lab.key;

    root  /var/www/inventario;
    index equipos.php;

    access_log /var/log/nginx/inventario_access.log;
    error_log  /var/log/nginx/inventario_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {                         # los .php, a PHP-FPM
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location /api/ {                            # la API, a Gunicorn
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /inc/ { deny all; }             # db.php no se sirve nunca
}
