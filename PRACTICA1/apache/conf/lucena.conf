<VirtualHost *:67>
    ServerName lucena.iaw.local
    ServerAlias www.lucena.iaw.local
    DocumentRoot /var/www/html/lucena.iaw.local
    ErrorLog /var/log/apache2/lucena_error.log
    CustomLog /var/log/apache2/lucena_access.log common

    <Files "configurar.php">
        Require all denied
    </Files>

    <Directory /var/www/html/lucena.iaw.local>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>